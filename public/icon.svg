<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nexusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="128" fill="url(#nexusGrad)"/>
  
  <!-- Stylized Book & Tech Sparkle Nexus -->
  <g transform="translate(106, 120)" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Open Book Pages -->
    <path d="M 150 220 C 150 160, 40 140, 20 140 L 20 40 C 40 40, 150 60, 150 120 Z" fill="rgba(255,255,255,0.15)"/>
    <path d="M 150 220 C 150 160, 260 140, 280 140 L 280 40 C 260 40, 150 60, 150 120 Z" fill="rgba(255,255,255,0.15)"/>
    
    <!-- Central Spine -->
    <line x1="150" y1="60" x2="150" y2="230" stroke="#ffffff" stroke-width="24"/>
    
    <!-- Nexus Star / AI Sparkle at Top -->
    <path d="M 150 -10 Q 150 35 185 35 Q 150 35 150 80 Q 150 35 115 35 Q 150 35 150 -10 Z" fill="#38bdf8" stroke="#38bdf8" stroke-width="6"/>
  </g>
</svg>
